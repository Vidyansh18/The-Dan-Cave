    $('#g-q', body).addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
    $('#g-rand', body).addEventListener('click', randomPick);
    body.addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      plat = c.dataset.p;
      $$('.chip', body).forEach(x => x.setAttribute('aria-pressed', String(x === c)));
      render();
    });
    render();
    return () => { run++; };
  }

  /* ── console wall ── */
  function buildConsoles(body) {
    const total = CONSOLES.reduce((n, [, l]) => n + l.length, 0);
    body.innerHTML = `<p class="count">${total} machines, oldest first.</p>` + CONSOLES.map(([era, list]) =>
      `<section class="era"><h3>${esc(era)}</h3><ul class="cards">${list.map(([n, m, y]) =>

      <div class="set-row"><span class="lab" id="l-snd">Sound</span><button class="chip" id="s-mute" type="button" aria-labelledby="l-snd s-mute"></button><span></span></div>
      <div class="set-row"><span class="lab" id="l-crt">Scanlines</span><button class="chip" id="s-crt" type="button" aria-labelledby="l-crt s-crt"></button><span></span></div>

    const om = $('#o-music', body), os = $('#o-sfx', body), mute = $('#s-mute', body), crt = $('#s-crt', body);
    const paint = () => {
      om.textContent = Math.round(state.musicVol * 100) + '%'; os.textContent = Math.round(state.sfxVol * 100) + '%';
      mute.setAttribute('aria-pressed', String(!state.muted)); mute.textContent = state.muted ? 'Off' : 'On';
      const on = !app.classList.contains('no-crt'); crt.setAttribute('aria-pressed', String(on)); crt.textContent = on ? 'On' : 'Off';
    };

    $('#s-sfx', body).addEventListener('input', e => { state.sfxVol = e.target.value / 100; Sound.sync(); paint(); Prefs.save(); });

    const root = lb || wrap, a = document.activeElement;
    const els = $$(FOCUSABLE, root).filter(el => el.getClientRects().length > 0);

    const first = els[0], last = els[els.length - 1];

    else if (!e.shiftKey && (a === last || !root.contains(a))) { e.preventDefault(); first.focus(); }
  });

  return { open, close, get isOpen() { return !!wrap; } };
})();

/* ════════ ARCADE: one cabinet, one game ════════ */

        <canvas width="${SZ}" height="${SZ}" role="img" aria-label="Snake game board"></canvas>
        <div class="arc-over" id="a-over"><span id="a-msg">Snake</span>
          <button class="btn" id="a-go" type="button"><span class="btn-in">Start &#9654;</span></button>
          <small>Steer with the arrow keys or W A S D. Swipe on a phone.</small></div>
      </div>
      <div class="dpad" aria-label="Steering buttons">
        <button class="btn" type="button" data-d="up" aria-label="Up"><span class="btn-in">&uarr;</span></button>
        <button class="btn" type="button" data-d="left" aria-label="Left"><span class="btn-in">&larr;</span></button>
        <button class="btn" type="button" data-d="down" aria-label="Down"><span class="btn-in">&darr;</span></button>
        <button class="btn" type="button" data-d="right" aria-label="Right"><span class="btn-in">&rarr;</span></button>
      </div>
      <p class="arc-help">Eat the pink cartridges. Walls and your own tail end the run.</p></div>`;
    const cv = $('canvas', body), g = cv.getContext('2d'), over = $('#a-over', body), msg = $('#a-msg', body), go = $('#a-go', body);
    const elScore = $('#a-score', body), elBest = $('#a-best', body);
    let snake, dir, queue, apple, score, best = loadBest(), stepMs, acc, last, raf = 0, phase = 'idle', t0 = performance.now();
    elBest.textContent = best;

    function reset() {
      snake = [{ x: 6, y: 9 }, { x: 5, y: 9 }, { x: 4, y: 9 }]; dir = { x: 1, y: 0 }; queue = [];
      score = 0; stepMs = 125; acc = 0; elScore.textContent = 0; placeApple();
    }
    function placeApple() {
      do { apple = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
      while (snake.some(s => s.x === apple.x && s.y === apple.y));
    }
    function turn(dx, dy) {
      if (phase !== 'play') return;
      const ref = queue.length ? queue[queue.length - 1] : dir;
      if ((dx === -ref.x && dy === -ref.y) || (dx === ref.x && dy === ref.y)) return;
      if (queue.length < 2) queue.push({ x: dx, y: dy });
    }
    function step() {
      if (queue.length) dir = queue.shift();
      const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some((s, i) => i < snake.length - 1 && s.x === h.x && s.y === h.y)) return crash();
      snake.unshift(h);
      if (h.x === apple.x && h.y === apple.y) {
        score++; elScore.textContent = score; stepMs = Math.max(62, stepMs - 3);
        Sound.play('blip', 520 + Math.min(score, 14) * 34, 0.07, 0.14); placeApple();
      } else snake.pop();
    }
    function crash() {
      phase = 'over';
      [220, 165, 110].forEach((f, i) => setTimeout(() => Sound.play('blip', f, 0.14, 0.2, 'sawtooth'), i * 120));
      if (score > best) { best = score; elBest.textContent = best; saveBest(best); }
      msg.innerHTML = `Game over<br><small>You ate ${score}. ${score && score === best ? 'New best!' : 'Best is ' + best + '.'}</small>`;
      $('.btn-in', go).innerHTML = 'Try again &#9654;';
      over.hidden = false; go.focus({ preventScroll: true });
    }
    function begin() {
      reset(); phase = 'play'; over.hidden = true; last = performance.now();
      Sound.play('yes');
    }

    function draw(now) {
      g.fillStyle = '#05030b'; g.fillRect(0, 0, SZ, SZ);
      g.fillStyle = '#1a1236';
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) g.fillRect(x * C + C / 2 - 1, y * C + C / 2 - 1, 2, 2);
      if (!snake) return;
      const blink = Math.floor((now - t0) / 300) % 2;                         // cartridge flickers
      const ax = apple.x * C, ay = apple.y * C;
      g.fillStyle = '#ff2a8a'; g.fillRect(ax + 2, ay + 1, C - 4, C - 3);
      g.fillStyle = blink ? '#ffd0e6' : '#ff7ab6'; g.fillRect(ax + 4, ay + 3, C - 8, 3);
      g.fillStyle = '#120a22'; g.fillRect(ax + 5, ay + C - 5, C - 10, 3);
      const n = snake.length;
      snake.forEach((s, i) => {
        const k = i / Math.max(1, n - 1);
        g.fillStyle = i === 0 ? '#e8ffff' : `hsl(${186 + k * 70},100%,${58 - k * 20}%)`;
        g.fillRect(s.x * C + 1, s.y * C + 1, C - 2, C - 2);
        if (i) { g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(s.x * C + 1, s.y * C + C - 4, C - 2, 3); }
      });
      const h = snake[0];                                                      // eyes sit on the side the head faces
      const eyes = dir.x > 0 ? [[10, 3], [10, 10]] : dir.x < 0 ? [[3, 3], [3, 10]] : dir.y > 0 ? [[3, 10], [10, 10]] : [[3, 3], [10, 3]];
      g.fillStyle = '#05030b';
      eyes.forEach(([ox, oy]) => g.fillRect(h.x * C + ox, h.y * C + oy, 3, 3));
    }
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (phase === 'play') {
        acc += Math.min(100, now - last); last = now;
        while (acc >= stepMs && phase === 'play') { acc -= stepMs; step(); }
      }
      draw(now);
    }

    const keys = e => {
      const k = e.key.toLowerCase();
      const map = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
      if (map[k] && !e.metaKey && !e.ctrlKey && !e.altKey) {
        if (/^arrow/.test(k)) e.preventDefault();
        if (phase === 'idle') begin();                                         // first key press starts the game
        if (phase === 'play') turn(...map[k]);
      }
    };
    let sx = 0, sy = 0, sid = null;
    cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; sid = e.pointerId; });
    cv.addEventListener('pointerup', e => {
      if (e.pointerId !== sid) return; sid = null;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
    });
    $$('.dpad [data-d]', body).forEach(b => b.addEventListener('click', () => {
      const d = b.dataset.d; turn(d === 'left' ? -1 : d === 'right' ? 1 : 0, d === 'up' ? -1 : d === 'down' ? 1 : 0);
    }));
    go.addEventListener('click', begin);
    document.addEventListener('keydown', keys);

    reset(); phase = 'idle'; raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', keys); phase = 'gone'; };
  }
  return { mount };
})();

/* ════════ BOOT: settings, sound wiring, keyboard, start-up ════════ */
const Prefs = {
  KEY: 'dancave.prefs.v1',
  load() {
    try {
      const p = JSON.parse(localStorage.getItem(this.KEY) || '{}');
      if (typeof p.music === 'number') state.musicVol = clamp(p.music);
      if (typeof p.sfx === 'number') state.sfxVol = clamp(p.sfx);
      if (typeof p.muted === 'boolean') state.muted = p.muted;
      if (p.crt === false) app.classList.add('no-crt');
    } catch (_) { /* storage can be unavailable */ }
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify({ music: state.musicVol, sfx: state.sfxVol, muted: state.muted, crt: !app.classList.contains('no-crt') })); } catch (_) { /* ignore */ }
  },
};

const UI = {
  paintHud() {
    const b = $('#btn-snd');
    $('.btn-in', b).innerHTML = pixIcon(state.muted ? 'mute' : 'snd', 2);
    b.setAttribute('aria-pressed', String(state.muted));
  },
  setMuted(v) { state.muted = !!v; Sound.sync(); Music.setMuted(); UI.paintHud(); Prefs.save(); },
};

/* ───────── one click sound for every button; a soft tick when you point at one ───────── */
const SFX_SEL = '.btn, .mod, .chip, .tile, [data-sfx]';
document.addEventListener('click', e => {
  const b = e.target.closest(SFX_SEL);
  if (!b || b.disabled) return;
  Sound.unlock(); Sound.play('click');
}, true);
let lastHover = null;
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const b = e.target.closest(SFX_SEL);
  if (b === lastHover) return;
  lastHover = b;
  if (b && !b.disabled) Sound.play('hover');
});
document.addEventListener('focusin', e => {
  try { if (e.target.matches(SFX_SEL) && e.target.matches(':focus-visible')) Sound.play('hover'); } catch (_) { /* ignore */ }
});

/* ───────── buttons ───────── */
$('#btn-yes').addEventListener('click', onYes);
$('#btn-no').addEventListener('click', onNo);
$('#skip').addEventListener('click', () => Intro.skip());
$('#sound-nudge').addEventListener('click', () => { Sound.unlock(); Music.retry(); });
$('#btn-snd').addEventListener('click', () => UI.setMuted(!state.muted));
const fsBtn = $('#btn-fs');
const fsEl = document.documentElement;
const fsReq = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
if (!fsReq) fsBtn.hidden = true;
fsBtn.addEventListener('click', () => {
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const p = fsReq.call(fsEl); if (p && p.catch) p.catch(() => {}); }
  } catch (_) { /* full screen can be blocked by the host page */ }
});

/* ───────── keyboard ───────── */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (state.scene === 'gate') {
    if (!Gate.ready || state.busy) return;
    if (k === 'y' || k === 'Y') { e.preventDefault(); $('#btn-yes').click(); }
    else if (k === 'n' || k === 'N') { e.preventDefault(); $('#btn-no').click(); }
    return;
  }
  if (state.scene === 'intro' && k === 'Escape') { Intro.skip(); return; }
  if (state.scene === 'menu' && !state.panel && /^Arrow/.test(k)) { e.preventDefault(); Bricks.navigate(k); }
});

/* ───────── cave parallax and housekeeping ───────── */
const par = $('.bg-par');
if (matchMedia('(pointer:fine)').matches && !REDUCED) {
  addEventListener('pointermove', e => {
    if (state.scene !== 'menu') return;
    par.style.transform = `translate3d(${(-(e.clientX / innerWidth - 0.5) * 34).toFixed(1)}px,${(-(e.clientY / innerHeight - 0.5) * 20).toFixed(1)}px,0)`;
  }, { passive: true });
}
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => Shelves.draw(), 150); });
document.addEventListener('visibilitychange', () => Music.duck(document.hidden ? 0 : 1, document.hidden ? 200 : 700));

/* ───────── test hooks: render a sound offline and report its level ───────── */
async function measureSfx(name, secs = 4, ...args) {
  const sr = 44100, oc = new OfflineAudioContext(2, sr * secs, sr);
  const bus = oc.createGain(); bus.gain.value = 0.9;
  const comp = oc.createDynamicsCompressor();
  comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
  const master = oc.createGain(); master.gain.value = CONFIG.sfxVolume;
  bus.connect(comp); comp.connect(master); master.connect(oc.destination);
  Synth[name](oc, bus, 0.01, ...args);
  const buf = await oc.startRendering();
  let peak = 0, sum = 0, n = 0, clipped = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; if (a >= 0.999) clipped++; sum += d[i] * d[i]; n++; }
  }
  return { name, peak: +peak.toFixed(3), rmsDb: +(20 * Math.log10(Math.sqrt(sum / n) || 1e-9)).toFixed(1), peakDb: +(20 * Math.log10(peak || 1e-9)).toFixed(1), clipped };
}
window.DanCave = { Perf, state, setScene, Intro, Wall, FX, Shake, Menu, Panels, Title, Sound, Music, Synth, Gate, Loader, Bricks, Art, Arcade, UI, detonate, startIntro, replayIntro, measureSfx, CONFIG };

/* ───────── go ───────── */
function boot() {
  Prefs.load();
  UI.paintHud();
  $('.btn-in', $('#btn-fs')).innerHTML = pixIcon('fs', 2);
  Bricks.build();
  Shelves.draw();
  Music.preload();
  Perf.start();
  const h = location.hash.replace('#', '');
  if (h === 'menu') { Menu.jump(); return; }
  if (h === 'intro') { startIntro(); return; }
  Gate.run();
}
if (document.fonts && document.fonts.load) {
  document.fonts.load('20px DanPixel').then(boot, boot);        // the pixel font is inline, so this is instant; it only guards the first paint
} else boot();

})();
</script>
