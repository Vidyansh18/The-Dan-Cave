/* Design plan
   palette : night violet #0d0719 (rooms) · volt #fcee0a (lead, from Cyberpunk 2077's yellow) · ice #00f0ff (support) · blood #ff003c (danger) · hot pink #ff2a8a (glow only)
   type    : DanPixel, a 5x7 pixel face drawn for this page (logo, buttons, crawl) + Chakra Petch for reading text
   layout  : the intro blows a brick wall apart; the menu is that wall rebuilt, one brick per room (running-bond offset)
   motion  : the intro is the one big moment; the menu stays quiet and only answers hover, focus and clicks */
:root{
  --void:#06030d; --night:#0d0719; --deep:#170d2e; --edge:#33275f;
  --volt:#fcee0a; --ice:#00f0ff; --blood:#ff003c; --pink:#ff2a8a;
  --ink:#efeaff; --mute:#a69fd0; --dim:#8d86c6;
  --px:"DanPixel","Courier New",monospace;
  --hud:"Chakra Petch","Bahnschrift","Rajdhani","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--hud);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px dashed var(--ice);outline-offset:3px}
.pix{display:block;image-rendering:pixelated}

/* ───────── pixel-stepped corner frames ───────── */
.cut{--s0:5px;--s:var(--s0);--bw:2px;--bd:var(--edge);--bg:var(--night);position:relative;isolation:isolate;padding:var(--bw);background:var(--bd);clip-path:polygon(0 calc(var(--s)*2),var(--s) calc(var(--s)*2),var(--s) var(--s),calc(var(--s)*2) var(--s),calc(var(--s)*2) 0,calc(100% - var(--s)*2) 0,calc(100% - var(--s)*2) var(--s),calc(100% - var(--s)) var(--s),calc(100% - var(--s)) calc(var(--s)*2),100% calc(var(--s)*2),100% calc(100% - var(--s)*2),calc(100% - var(--s)) calc(100% - var(--s)*2),calc(100% - var(--s)) calc(100% - var(--s)),calc(100% - var(--s)*2) calc(100% - var(--s)),calc(100% - var(--s)*2) 100%,calc(var(--s)*2) 100%,calc(var(--s)*2) calc(100% - var(--s)),var(--s) calc(100% - var(--s)),var(--s) calc(100% - var(--s)*2),0 calc(100% - var(--s)*2))}
.cut::before{content:"";position:absolute;inset:var(--bw);z-index:-1;background:var(--bg);--s:calc(var(--s0) - 1px);clip-path:polygon(0 calc(var(--s)*2),var(--s) calc(var(--s)*2),var(--s) var(--s),calc(var(--s)*2) var(--s),calc(var(--s)*2) 0,calc(100% - var(--s)*2) 0,calc(100% - var(--s)*2) var(--s),calc(100% - var(--s)) var(--s),calc(100% - var(--s)) calc(var(--s)*2),100% calc(var(--s)*2),100% calc(100% - var(--s)*2),calc(100% - var(--s)) calc(100% - var(--s)*2),calc(100% - var(--s)) calc(100% - var(--s)),calc(100% - var(--s)*2) calc(100% - var(--s)),calc(100% - var(--s)*2) 100%,calc(var(--s)*2) 100%,calc(var(--s)*2) calc(100% - var(--s)),var(--s) calc(100% - var(--s)),var(--s) calc(100% - var(--s)*2),0 calc(100% - var(--s)*2))}
.win-fx{filter:drop-shadow(0 0 22px rgba(252,238,10,.16)) drop-shadow(6px 6px 0 rgba(0,0,0,.7))}
.win-bar{display:flex;align-items:center;gap:8px;padding:9px 14px 7px;background:var(--volt);color:#0a0514;font:20px/1 var(--px);letter-spacing:.04em}
.win-bar span{flex:1}
.win-bar i{width:10px;height:10px;background:#0a0514}
.win-bar i:nth-of-type(2){opacity:.55}.win-bar i:nth-of-type(3){opacity:.25}

/* ───────── buttons: one retro look, one click sound ───────── */
.btn{--c:var(--volt);--glow:252,238,10;position:relative;display:inline-block;font:20px/1 var(--px);letter-spacing:.04em;color:#0a0514;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.75));-webkit-tap-highlight-color:transparent;transition:filter .12s}
.btn .btn-in{--s:4px;display:flex;align-items:center;justify-content:center;gap:.6em;padding:.8em 1.5em .66em;background:var(--c);clip-path:polygon(0 var(--s),var(--s) var(--s),var(--s) 0,calc(100% - var(--s)) 0,calc(100% - var(--s)) var(--s),100% var(--s),100% calc(100% - var(--s)),calc(100% - var(--s)) calc(100% - var(--s)),calc(100% - var(--s)) 100%,var(--s) 100%,var(--s) calc(100% - var(--s)),0 calc(100% - var(--s)));transition:transform .06s,background .12s}
.btn:hover,.btn:focus-visible{filter:drop-shadow(0 0 14px rgba(var(--glow),.65)) drop-shadow(4px 4px 0 rgba(0,0,0,.75))}
.btn:hover .btn-in,.btn:focus-visible .btn-in{background:color-mix(in srgb,var(--c) 82%,#fff)}
.btn:active{filter:drop-shadow(1px 1px 0 rgba(0,0,0,.75))}
.btn:active .btn-in{transform:translate(3px,3px)}
.btn--ghost{--c:var(--blood);--glow:255,0,60;color:var(--c)}
.btn--ghost .btn-in{background:#14081f;box-shadow:inset 0 0 0 3px var(--c)}
.btn--ghost:hover .btn-in,.btn--ghost:focus-visible .btn-in{background:#240a2c}
.btn--ice{--c:var(--ice);--glow:0,240,255}
.btn--sm{font-size:20px}
.btn--sm .btn-in{padding:.55em .9em .45em}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ───────── scenes ───────── */
#app{position:fixed;inset:0;overflow:hidden;background:var(--void)}
#gate,#loader,#denied{position:fixed;inset:0;display:none}
#app[data-scene="gate"] #gate{display:grid}
#app[data-scene="loading"] #loader{display:grid}
#app[data-scene="denied"] #denied{display:grid}
#stage,#fx,#hud,#shock,#flash{visibility:hidden}
#app:is([data-scene="intro"],[data-scene="boom"],[data-scene="menu"]) :is(#stage,#fx,#hud,#shock,#flash){visibility:visible}

/* cave interior (pixel-art game shelves) */
#bg{position:absolute;inset:-28px;z-index:0;opacity:0;transition:opacity .9s ease,filter .9s ease}
#bg .bg-par{position:absolute;inset:0;transition:transform .5s ease-out;will-change:transform}
#bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.bg-lamp{position:absolute;inset:0;pointer-events:none}
.bg-lamp--a{background:radial-gradient(60% 55% at 10% 72%,rgba(0,240,255,.22),transparent 70%);animation:breathe 9s ease-in-out infinite}
.bg-lamp--b{background:radial-gradient(55% 50% at 90% 30%,rgba(255,42,138,.22),transparent 70%);animation:breathe 11s ease-in-out -4s infinite}
.bg-shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 78% 68% at 50% 46%,rgba(6,3,13,.46) 0,rgba(6,3,13,.7) 62%,rgba(6,3,13,.94) 100%)}
#app[data-scene="gate"] #bg{opacity:.55;filter:blur(2px) saturate(.85)}
#app[data-scene="loading"] #bg{opacity:.16;filter:blur(3px)}
#app[data-scene="intro"] #bg{opacity:0;transition-duration:.2s}
#app[data-scene="intro"].charged #bg{opacity:.4;transition-duration:1.8s}
#app:is([data-scene="boom"],[data-scene="menu"]) #bg{opacity:1;transition-duration:.35s}
#app[data-scene="menu"] #bg{transition-duration:.9s}

#stage{position:absolute;inset:0;z-index:10}
#backlight{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;background:radial-gradient(ellipse 62% 56% at 50% 52%,rgba(0,240,255,.5),rgba(255,42,138,.32) 46%,rgba(0,0,0,0) 76%)}
#app.charged #backlight{opacity:1;animation:pulse .55s ease-in-out infinite alternate}
#app:is([data-scene="boom"],[data-scene="menu"]) #backlight{opacity:0;animation:none;transition-duration:.4s}

/* the title lives in the menu layer, behind the wall until the blast */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:0 16px 36px;overflow:hidden;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
#menu.compact{overflow-x:hidden;overflow-y:auto}
#head{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#menu.compact #head{position:relative;inset:auto;flex:none;margin-top:clamp(16px,5vh,56px)}
#title{--u:min(4.7vh,3.9vw);font-family:var(--px);font-weight:400;line-height:1;text-align:center;color:var(--volt);opacity:0;transition:opacity 1.3s ease}
#title span{display:block;font-size:calc(var(--u)*10);line-height:.74;white-space:nowrap;text-shadow:max(2px,calc(var(--u)*.34)) max(2px,calc(var(--u)*.34)) 0 rgba(255,0,60,.92),calc(var(--u)*-.2) calc(var(--u)*-.1) 0 rgba(0,240,255,.8),0 0 calc(var(--u)*1.8) rgba(252,238,10,.3)}
#title .t-the{font-size:calc(var(--u)*3.6);line-height:1;letter-spacing:.5em;margin:0 0 calc(var(--u)*1.1) .5em;color:var(--ice);text-shadow:none}
#title .t-dan{margin-bottom:calc(var(--u)*.8)}
#app.charged #title,#app:is([data-scene="boom"],[data-scene="menu"]) #title{opacity:1}
#menu.compact #title{--u:clamp(4.5px,min(.95vw,1.5vh),9px);display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:calc(var(--u)*3.4)}
#menu.compact #title .t-the{flex:0 0 100%;margin:0 0 calc(var(--u)*1.6) 0;text-align:center}
#menu.compact #title .t-dan{margin-bottom:0}
#menu.compact #title.glitch span{animation:glitch .28s steps(2) 1}
#tagline{margin-top:clamp(10px,1.8vh,18px);font-size:clamp(15px,1.5vw,19px);letter-spacing:.04em;color:var(--mute);text-align:center;opacity:0;transition:opacity .6s .2s}
#menu:not(.compact) #tagline{display:none}
#menu.ready #tagline{opacity:1}

/* the rebuilt wall: six bricks in running bond */
#bricks{--bw:clamp(250px,25vw,380px);--bh:max(calc(var(--bw)*.46),142px);--gap:10px;display:grid;grid-template-columns:repeat(3,var(--bw));gap:var(--gap);width:max-content;margin:clamp(20px,4.4vh,46px) auto 0;padding-right:calc((var(--bw) + var(--gap))/2)}
#menu:not(.compact) :is(#bricks,#keys){visibility:hidden}
.mod{--a:var(--volt);--glow:252,238,10;position:relative;display:block;width:100%;height:var(--bh);opacity:0;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.7));transition:filter .15s}
.mod:nth-child(n+4){left:calc((var(--bw) + var(--gap))/2)}
#menu.ready .mod{animation:brickIn .55s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*95ms + 120ms)}
.mod-in{--s:5px;position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:16px 18px 14px;background:
  radial-gradient(120% 150% at 0% 0%,rgba(var(--glow),.0),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 2px,transparent 2px 4px),
  linear-gradient(160deg,#1f1236,#120a24 62%,#0d071b);
  box-shadow:inset 0 0 0 2px #3a2c6c,inset 0 4px 0 2px rgba(255,255,255,.035);clip-path:polygon(0 calc(var(--s)*2),var(--s) calc(var(--s)*2),var(--s) var(--s),calc(var(--s)*2) var(--s),calc(var(--s)*2) 0,calc(100% - var(--s)*2) 0,calc(100% - var(--s)*2) var(--s),calc(100% - var(--s)) var(--s),calc(100% - var(--s)) calc(var(--s)*2),100% calc(var(--s)*2),100% calc(100% - var(--s)*2),calc(100% - var(--s)) calc(100% - var(--s)*2),calc(100% - var(--s)) calc(100% - var(--s)),calc(100% - var(--s)*2) calc(100% - var(--s)),calc(100% - var(--s)*2) 100%,calc(var(--s)*2) 100%,calc(var(--s)*2) calc(100% - var(--s)),var(--s) calc(100% - var(--s)),var(--s) calc(100% - var(--s)*2),0 calc(100% - var(--s)*2));transition:transform .08s,box-shadow .15s,background .15s}
.mod-top{display:flex;justify-content:space-between;align-items:flex-start;color:var(--a);--ic1:var(--a)}
.mod-go{font:20px/1 var(--px);color:var(--a);opacity:0;transform:translateX(-6px);transition:opacity .15s,transform .15s}
.mod-name{display:block;font:20px/1 var(--px);letter-spacing:.04em;color:var(--a)}
.mod-blurb{display:block;margin-top:8px;font-size:14.5px;line-height:1.35;color:var(--mute)}
.mod:hover,.mod:focus-visible{filter:drop-shadow(0 0 16px rgba(var(--glow),.5)) drop-shadow(4px 4px 0 rgba(0,0,0,.7))}
.mod:hover .mod-in,.mod:focus-visible .mod-in{transform:translate(-2px,-2px);box-shadow:inset 0 0 0 2px var(--a),inset 0 4px 0 2px rgba(255,255,255,.05);background:
  radial-gradient(120% 150% at 0% 0%,rgba(var(--glow),.2),transparent 62%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 2px,transparent 2px 4px),
  linear-gradient(160deg,#241540,#150b2a 62%,#0f081f)}
.mod:hover .mod-go,.mod:focus-visible .mod-go{opacity:1;transform:none}
.mod:focus-visible{outline:none}
.mod:active{filter:drop-shadow(1px 1px 0 rgba(0,0,0,.7))}
.mod:active .mod-in{transform:translate(3px,3px)}
.keys{margin:clamp(22px,4vh,40px) auto 0;font:20px/1 var(--px);color:var(--dim);letter-spacing:.04em;text-align:center;opacity:0;transition:opacity .8s 1s}
#menu.ready .keys{opacity:1}
.keys b{font-weight:400;color:var(--mute)}

/* wall, crawl, effects */
#wall{position:absolute;inset:0;width:100%;height:100%}
#wallshade{position:absolute;inset:0;background:#05020b;opacity:.32;transition:opacity 1.4s ease;pointer-events:none}
#app.charged #wallshade{opacity:.08}
#app:is([data-scene="boom"],[data-scene="menu"]) #wallshade{opacity:0;transition-duration:.15s}
#crawl{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#crawl::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 74% 66% at 50% 52%,rgba(5,2,11,.8),rgba(5,2,11,.5) 60%,rgba(5,2,11,0) 100%)}
.cl{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--px);letter-spacing:.06em;color:var(--volt);opacity:0;will-change:transform,opacity;text-shadow:0 0 .4em rgba(252,238,10,.42),.07em .07em 0 rgba(255,0,60,.6),-.05em -.03em 0 rgba(0,240,255,.45)}
.cl .hl{color:var(--ice);text-shadow:0 0 .45em rgba(0,240,255,.55),.07em .07em 0 rgba(255,0,60,.5)}
.cl.fin{letter-spacing:.09em}
.cl.fin .hl{color:var(--pink);text-shadow:0 0 .5em rgba(255,42,138,.7),.07em .07em 0 rgba(0,240,255,.45)}
.cl .dots i{font-style:normal;display:inline-block;animation:dot 1.8s ease-in-out infinite;animation-delay:calc(var(--n)*.14s)}
#fx{position:absolute;inset:0;z-index:20;width:100%;height:100%;pointer-events:none}
#shock{position:absolute;z-index:21;left:50%;top:50%;width:24vmax;height:24vmax;margin:-12vmax 0 0 -12vmax;border-radius:50%;border:6px solid rgba(255,255,255,.95);box-shadow:0 0 70px 24px rgba(255,170,80,.65),inset 0 0 70px 14px rgba(255,170,80,.45);opacity:0;pointer-events:none;transform:scale(.05)}
#shock.go{animation:shock 1.3s cubic-bezier(.08,.7,.2,1) forwards}
#flash{position:absolute;z-index:22;inset:0;background:#fff;opacity:0;pointer-events:none}

/* HUD */
#hud{position:absolute;z-index:30;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:10px}
#hud .btn{--ic1:#0a0514}
#hud .btn-in{padding:.5em .6em}
#skip{position:absolute;z-index:30;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));visibility:hidden;opacity:0;transition:opacity .6s}
#app[data-scene="intro"] #skip.show{visibility:visible;opacity:1}
#sound-nudge{position:absolute;z-index:30;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%)}

/* ───────── gate ───────── */
#gate{z-index:80;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(6,3,13,.5),rgba(6,3,13,.9))}
#gate .win{--bd:var(--volt);--s0:6px;width:min(660px,92vw)}
.win-body{padding:clamp(22px,4vw,38px) clamp(20px,4vw,38px) clamp(20px,3.4vw,30px)}
.gate-q{display:flex;align-items:center;flex-wrap:wrap;min-height:2.2em;font:clamp(30px,6.4vw,50px)/1.15 var(--px);color:var(--volt);letter-spacing:.04em;text-shadow:3px 3px 0 rgba(255,0,60,.8),-2px 0 0 rgba(0,240,255,.7)}
.caret{display:inline-block;width:.5em;height:.82em;margin-left:.12em;background:var(--volt);animation:blink 1s steps(1) infinite}
.gate-actions{display:flex;gap:22px;margin-top:clamp(22px,4vw,34px);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .35s,transform .35s}
.gate-actions.on{opacity:1;pointer-events:auto;transform:none}
.gate-actions .btn{font-size:30px}
.gate-keys{margin-top:22px;font-size:14px;letter-spacing:.06em;color:var(--dim)}

/* ───────── loader ───────── */
#loader{z-index:80;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(6,3,13,.55),rgba(6,3,13,.95))}
#loader .win{--bd:var(--volt);width:min(680px,92vw)}
.boot-log{list-style:none;padding:0;margin:0 0 22px;min-height:7.5em;font:20px/1.5 var(--px);color:var(--mute);letter-spacing:.03em}
.boot-log li::before{content:"> ";color:var(--ice)}
.boot-log li.ok::after{content:" OK";color:var(--volt)}
.load-row{display:flex;align-items:center;gap:16px}
.bar{display:flex;flex:1;gap:3px;padding:5px;background:#080412;box-shadow:inset 0 0 0 3px var(--volt)}
.bar i{flex:1;height:28px;background:#1a1030}
.bar i.on{background:var(--volt);box-shadow:0 0 10px rgba(252,238,10,.45)}
.pct{min-width:4.2ch;font:30px/1 var(--px);color:var(--volt);text-align:right}

/* ───────── denied ───────── */
#denied{z-index:90;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 46%,#e0141f 0%,#b10b16 46%,#74060f 100%);overflow:hidden}
#denied::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 5px);pointer-events:none}
#denied::after{content:"";position:absolute;left:0;right:0;height:22%;top:-25%;background:linear-gradient(transparent,rgba(255,255,255,.12),transparent);animation:sweep 1.6s linear infinite;pointer-events:none}
#denied p{position:relative;max-width:min(1100px,94vw);font:clamp(34px,8.6vw,118px)/1.12 var(--px);color:#000;text-align:center;letter-spacing:.03em;text-wrap:balance;text-shadow:5px 5px 0 rgba(255,70,70,.55);animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both,tremble .18s steps(2) .5s infinite}
#denied.out{opacity:0;transition:opacity .5s}

/* ───────── panels & modules ───────── */
#panels{position:absolute;z-index:60;inset:0;pointer-events:none}
#panels>*{pointer-events:auto}
.panel-wrap{position:fixed;inset:0;display:grid;place-items:center;padding:clamp(10px,3vw,40px);background:rgba(4,2,10,.9)}
.panel-wrap .win-fx{width:min(1080px,100%);max-height:100%;display:flex;filter:none}
.panel{--bd:var(--edge);--s0:6px;width:100%;display:flex;flex-direction:column;max-height:calc(100vh - 2*clamp(10px,3vw,40px));max-height:calc(100dvh - 2*clamp(10px,3vw,40px));animation:crtOn .32s cubic-bezier(.2,.8,.2,1) both}
.panel:focus{outline:none}
.panel-bar{--a:var(--volt);display:flex;align-items:center;gap:14px;padding:12px 16px 10px 18px;background:#140b28;border-bottom:2px solid var(--a)}
.panel-bar h2{flex:1;font:30px/1 var(--px);color:var(--a);letter-spacing:.04em;min-width:0}
.panel-bar .pix{--ic1:var(--a)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:22px clamp(16px,3vw,32px) 28px;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.lede{max-width:62ch;font-size:17px;line-height:1.55;color:var(--ink)}
.count{margin:6px 0 14px;font-size:14px;color:var(--dim)}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px}
.search input{width:100%;padding:12px 14px;font-size:16px;color:var(--ink);background:#080412;border:0;box-shadow:inset 0 0 0 2px var(--edge);border-radius:0}
.search input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ice)}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px 8px;margin-bottom:6px}
.chip{font:20px/1 var(--px);padding:.5em .7em .4em;color:var(--mute);background:#120a24;box-shadow:inset 0 0 0 2px var(--edge);transition:color .1s,background .1s,box-shadow .1s}
.chip:hover{color:var(--ink);box-shadow:inset 0 0 0 2px var(--ice)}
.chip[aria-pressed="true"]{color:#0a0514;background:var(--volt);box-shadow:none}
.pick{min-height:0;margin:10px 0 4px}
.pick-box{display:flex;gap:16px;align-items:center;padding:16px 18px;background:#0a0418;box-shadow:inset 0 0 0 2px var(--ice)}
.pick-box>div{flex:1;min-width:0}
.pick-label{font-size:14px;color:var(--mute)}
.pick-title{font:30px/1.1 var(--px);color:var(--ice);letter-spacing:.03em}
.pick-box.done .pick-title{color:var(--volt);animation:flick .4s steps(2) 2}
.cards{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:10px;justify-content:space-between;padding:14px 14px 12px;background:#100a21;box-shadow:inset 0 0 0 2px #2a1f50;min-height:92px}
.card .name{display:block;font-size:17px;font-weight:600;line-height:1.25;color:var(--ink)}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--dim)}
.badge{font:20px/1 var(--px);padding:.35em .5em .25em;color:#0a0514;background:var(--ice)}
.badge[data-p="NES"],.badge[data-p="SNES"]{background:var(--blood);color:#fff}
.badge[data-p="GENESIS"],.badge[data-p="DREAMCAST"]{background:var(--pink);color:#0a0514}
.badge[data-p="PC"],.badge[data-p="SWITCH"]{background:var(--volt)}
.badge[data-p="ARCADE"]{background:#fff}
.empty{grid-column:1/-1;padding:30px 0;color:var(--mute)}
.era{margin:0 0 26px}
.era h3{margin:0 0 12px;font:20px/1 var(--px);color:var(--volt);letter-spacing:.05em}
.era .cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.hw{position:relative;padding-left:34px}
.hw::before{content:"";position:absolute;left:14px;top:50%;width:8px;height:8px;margin-top:-4px;background:var(--ice);box-shadow:0 0 8px var(--ice)}
.hw .yr{font:20px/1 var(--px);color:var(--ice)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{position:relative;display:block;aspect-ratio:16/10;overflow:hidden;background:#0a0418;box-shadow:inset 0 0 0 2px var(--edge);transition:box-shadow .15s,transform .15s}
.tile canvas,.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.tile::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.tile span{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px 12px 9px;font-size:15px;font-weight:600;background:linear-gradient(transparent,rgba(5,2,11,.92));text-align:left}
.tile:hover,.tile:focus-visible{box-shadow:inset 0 0 0 3px var(--pink),0 0 24px rgba(255,42,138,.35)}
.lightbox{position:fixed;inset:0;z-index:70;display:grid;grid-template-rows:1fr auto;place-items:center;gap:12px;padding:clamp(12px,3vw,34px);background:rgba(3,1,8,.97)}
.lightbox .frame{position:relative;width:min(1100px,100%);max-height:100%;aspect-ratio:16/10;box-shadow:0 0 0 3px var(--pink),0 0 50px rgba(255,42,138,.3);background:#000}
.lightbox canvas,.lightbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.lb-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(1100px,100%)}
.lb-cap{flex:1;min-width:200px}
.lb-cap b{display:block;font:20px/1.2 var(--px);color:var(--pink);font-weight:400}
.lb-cap span{font-size:14px;color:var(--mute)}
.about{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,4vw,44px);align-items:start}
.about h3{margin:0 0 12px;font:20px/1 var(--px);color:var(--volt);letter-spacing:.05em}
.about p+p{margin-top:14px}
.rules{list-style:none;padding:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 14px;background:#100a21;box-shadow:inset 0 0 0 2px #2a1f50}
.rules li::before{content:"\25B6";grid-row:1/3;font:20px/1.2 var(--px);color:var(--ice)}
.rules b{font-size:17px;font-weight:600}
.rules span{font-size:14.5px;color:var(--mute);line-height:1.4}
.set{display:grid;gap:18px;max-width:560px}
.set-row{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:14px}
.set-row label,.set-row .lab{font-size:16px;color:var(--ink)}
.set-row output{font:20px/1 var(--px);color:var(--volt);min-width:3.4ch;text-align:right}
.set-row .chip{justify-self:start;min-width:6ch;text-align:center}
.set-actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:#1a1030;box-shadow:inset 0 0 0 2px var(--edge)}
input[type=range]::-moz-range-track{height:10px;background:#1a1030;box-shadow:inset 0 0 0 2px var(--edge)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:26px;margin-top:-8px;background:var(--volt);border:0;border-radius:0;box-shadow:3px 3px 0 #000}
input[type=range]::-moz-range-thumb{width:18px;height:26px;background:var(--volt);border:0;border-radius:0;box-shadow:3px 3px 0 #000}

/* arcade */
.arc{display:grid;justify-items:center;gap:14px}
.arc-top{display:flex;gap:28px;font:20px/1 var(--px);color:var(--mute)}
.arc-top b{font-weight:400;color:var(--volt)}
.arc-screen{position:relative;width:min(440px,100%);aspect-ratio:1;background:#05030b;box-shadow:0 0 0 3px var(--ice),0 0 36px rgba(0,240,255,.25)}
.arc-screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.arc-screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
.arc-over{position:absolute;inset:0;z-index:2;display:grid;place-content:center;gap:12px;text-align:center;background:rgba(5,2,11,.78);font:30px/1.2 var(--px);color:var(--volt)}
.arc-over .btn{justify-self:center}
.arc-over small{display:block;font:15px/1.4 var(--hud);color:var(--mute)}
.arc-over[hidden]{display:none}
.dpad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px}
.dpad .btn{font-size:20px}
.dpad .btn-in{height:100%;padding:0}
.dpad [data-d="up"]{grid-area:1/2}
.dpad [data-d="left"]{grid-area:2/1}
.dpad [data-d="down"]{grid-area:2/2}
.dpad [data-d="right"]{grid-area:2/3}
.arc-help{font-size:14px;color:var(--dim);text-align:center}
@media (pointer:coarse){.dpad{display:grid}}

/* CRT */
#crt{position:fixed;inset:0;z-index:200;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,rgba(0,0,0,0) 56%,rgba(0,0,0,.5) 100%)}
#crt::after{content:"";position:absolute;left:0;right:0;top:-20%;height:18%;background:linear-gradient(transparent,rgba(255,255,255,.035),transparent);animation:sweep 8s linear infinite}
.no-crt #crt{display:none}

/* ───────── keyframes ───────── */
#app.has-panel :is(.bg-lamp,#crt::after){animation-play-state:paused}
.lowfx :is(.bg-lamp,#crt::after,#backlight){animation:none!important}
@keyframes blink{50%{opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes pulse{from{opacity:.7}to{opacity:1}}
@keyframes dot{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes sweep{to{transform:translateY(660%)}}
@keyframes brickIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes crtOn{0%{opacity:0;transform:scale(.4,.012);filter:brightness(3)}45%{opacity:1;transform:scale(1,.012);filter:brightness(2)}100%{opacity:1;transform:none;filter:none}}
@keyframes shock{0%{opacity:1;transform:scale(.05)}100%{opacity:0;transform:scale(7)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-5deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
@keyframes tremble{0%{translate:-2px 1px}100%{translate:2px -1px}}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-6px,2px);clip-path:inset(10% 0 50% 0)}50%{transform:translate(5px,-2px);clip-path:inset(55% 0 5% 0)}100%{transform:none;clip-path:none}}

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════
   EDIT ME: everything Dan will want to change is in this block
   ════════════════════════════════════════════════════════════════ */

// The crawl. *asterisks* mark highlighted words.

// Hardware timeline: [era, [[name, maker, year], ...]]
const CONSOLES = [

  ['8-bit', [['NES / Famicom', 'Nintendo', 1983], ['Master System', 'Sega', 1985]]],

  ['3D arrives', [['Saturn', 'Sega', 1994], ['PlayStation', 'Sony', 1994], ['Nintendo 64', 'Nintendo', 1996], ['Dreamcast', 'Sega', 1998]]],
  ['Next generation', [['PlayStation 2', 'Sony', 2000], ['GameCube', 'Nintendo', 2001], ['Xbox', 'Microsoft', 2001]]],
  ['HD', [['Xbox 360', 'Microsoft', 2005], ['PlayStation 3', 'Sony', 2006], ['Wii', 'Nintendo', 2006]]],
  ['Right now', [['PlayStation 4', 'Sony', 2013], ['Xbox One', 'Microsoft', 2013], ['Nintendo Switch', 'Nintendo', 2017], ['PlayStation 5', 'Sony', 2020], ['Xbox Series X|S', 'Microsoft', 2020]]],
];

// Gallery. Add `src: 'photos/den-1.jpg'` to show a real photo instead of the placeholder art.
const GALLERY = [
  { title: 'Neon skyline', kind: 'skyline', pal: 0, src: null },
  { title: 'Cartridge shelves', kind: 'shelf', pal: 1, src: null },
  { title: 'The CRT corner', kind: 'crt', pal: 2, src: null },
  { title: 'Arcade row', kind: 'cabinets', pal: 0, src: null },
  { title: 'Sunset session', kind: 'skyline', pal: 1, src: null },
  { title: 'Console wall', kind: 'shelf', pal: 2, src: null },
  { title: 'Late-night setup', kind: 'crt', pal: 0, src: null },
  { title: 'Coin-op corner', kind: 'cabinets', pal: 1, src: null },
];

const ABOUT = {
  story: [
    'When I was young, my mother told me I could only play games, or spend money on consoles, once I started earning for myself.',
    'So I worked hard, stayed patient, and built the collection one find at a time. Today I own every game and every console on this planet, and the Dan Cave is where they live.',
  ],
  rules: [
    ['Earn it first.', 'Mom was right. Games and consoles are for people who work for them.'],
    ['Stay patient.', 'A great collection is built one find at a time.'],
    ['Every console gets a home.', 'If it plays something, it has a place on the wall.'],
    ['Game night is not up for debate.', 'The schedule bends around it.'],
    ['Losers stay outside.', 'The bouncer at the door checks.'],
  ],
};

/* ════════════════════════════════════════════════════════════════ */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const app = $('#app');

const state = {
  scene: 'gate',
  muted: false,
  musicVol: CONFIG.musicVolume,
  sfxVol: CONFIG.sfxVolume,
  busy: false,
  panel: null,
};
function setScene(s) { state.scene = s; app.dataset.scene = s; }

/* tiny rAF tween */
function tween(ms, fn, ease = t => t) {
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now) {
      const t = clamp((now - t0) / ms);
      fn(ease(t));
      if (t < 1) requestAnimationFrame(step); else res();
    })(t0);
  });
}

/* ───────── pixel icons (12 px wide grids, drawn as crisp SVG) ───────── */
const PIX = {
  cart: [
    '.##########.', '############', '##dddddddd##', '##d#xx#xxd##', '##dddddddd##',
    '############', '############', '.##########.', '..#.#..#.#..', '..#.#..#.#..'],
  pad: [
    '..########..', '.##########.', '###d####x###', '##ddd##x#x##', '###d####x###',
    '.##########.', '.###....###.', '..##....##..'],
  frame: [
    '############', '#dddddddddd#', '#dddddddxxd#', '#dddd#ddxxd#', '#ddd###dddd#',
    '#dd#####d#d#', '#d#######d##', '############'],
  stick: [
    '....xxxx....', '...xxxxxx...', '...xxxxxx...', '....xxxx....', '.....##.....',
    '.....##.....', '.....##.....', '############', '############', '##d##d##d###'],
  player: [
    '....####....', '...######...', '...oooooo...', '...######...', '....####....',
    '..########..', '.##########.', '.##########.'],
  sliders: [
    '...xx.......', '####xx######', '...xx.......', '............', '.......xx...',
    '########xx##', '.......xx...', '............', '.....xx.....', '#####xx#####', '.....xx.....'],
  snd: [
    '.....#......', '....##..#...', '###.##...#..', '###.##.#.#..', '###.##.#.#..',
    '###.##...#..', '....##..#...', '.....#......'],
  mute: [
    '.....#......', '....##......', '###.##.#...#', '###.##..#.#.', '###.##...#..',
    '###.##..#.#.', '....##.#...#', '.....#......'],
  fs: [
    '###......###', '#..........#', '#..........#', '............', '............',
    '............', '............', '#..........#', '#..........#', '###......###'],
};
const PIX_COL = { '#': 'var(--ic1,currentColor)', o: 'var(--ice)', x: 'var(--pink)', d: '#1a1033', w: '#fff' };
function pixIcon(name, scale = 3) {
  const rows = PIX[name]; const h = rows.length, w = rows[0].length;
  let r = '';
  rows.forEach((row, y) => { for (let x = 0; x < w; x++) { const c = row[x]; if (c !== '.') r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PIX_COL[c]}"/>`; } });
  return `<svg class="pix" viewBox="0 0 ${w} ${h}" width="${w * scale}" height="${h * scale}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

/* STORY helpers */
const storyPlain = () => STORY.map(p => p.text.replace(/\*/g, '') + (p.dots ? '...' : '')).join(' ');

/* ════════════════════════════════════════════════════════════════
   SOUND
   Effects are synthesised (oscillators + noise), so there are no sample files.
   Every builder takes (ctx, out, t) so it also works on an OfflineAudioContext.
   ════════════════════════════════════════════════════════════════ */
const Synth = (() => {
  const EPS = 0.0001;
  const noiseCache = new WeakMap();
  function noiseBuffer(ctx) {
    let b = noiseCache.get(ctx);
    if (!b) {
      const n = Math.floor(ctx.sampleRate * 2);
      b = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      noiseCache.set(ctx, b);
    }
    return b;
  }
  function env(p, t, peak, attack, dur) {
    p.setValueAtTime(EPS, t);
    p.exponentialRampToValueAtTime(Math.max(peak, EPS * 2), t + attack);
    p.exponentialRampToValueAtTime(EPS, t + dur);
  }
  function osc(ctx, out, o) {
    const { type = 'square', f0 = 440, f1 = null, t = 0, dur = 0.1, gain = 0.2, attack = 0.002, lp = null } = o;
    const n = ctx.createOscillator();
    n.type = type;
    n.frequency.setValueAtTime(f0, t);
    if (f1 != null) n.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ctx.createGain();
    env(g.gain, t, gain, Math.min(attack, dur * 0.95), dur);
    let node = n;
    if (lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; n.connect(f); node = f; }
    node.connect(g); g.connect(out);
    n.start(t); n.stop(t + dur + 0.05);
  }
  function noise(ctx, out, o) {
    const { t = 0, dur = 0.1, gain = 0.2, type = 'lowpass', f0 = 2000, f1 = null, q = 0.7, attack = 0.002 } = o;
    const s = ctx.createBufferSource();
    s.buffer = noiseBuffer(ctx); s.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
    if (f1 != null) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ctx.createGain();
    env(g.gain, t, gain, Math.min(attack, dur * 0.95), dur);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }
  const softClip = (() => {
    const n = 2048, c = new Float32Array(n), k = 1.7;
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(x * k) / Math.tanh(k); }
    return c;
  })();
  function impulse(ctx, secs, decay) {
    const n = Math.floor(ctx.sampleRate * secs);
    const b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
    return b;
  }

  return {
    /* the one button click: mechanical tick + 8-bit chirp + low thunk */
    click(ctx, out, t) {
      noise(ctx, out, { t, dur: 0.014, gain: 0.55, type: 'highpass', f0: 2600, q: 0.4, attack: 0.0005 });
      osc(ctx, out, { type: 'square', f0: 1760, f1: 560, t, dur: 0.07, gain: 0.22, attack: 0.001 });
      osc(ctx, out, { type: 'triangle', f0: 210, f1: 84, t, dur: 0.08, gain: 0.6, attack: 0.001 });
    },
    hover(ctx, out, t) {
      osc(ctx, out, { type: 'triangle', f0: 1320, f1: 1760, t, dur: 0.035, gain: 0.14, attack: 0.001 });
    },
    blip(ctx, out, t, f = 880, dur = 0.05, gain = 0.1, type = 'square') {
      osc(ctx, out, { type, f0: f, f1: f * 1.02, t, dur, gain: gain * 1.8, attack: 0.001 });
    },
    type(ctx, out, t) {
      osc(ctx, out, { type: 'square', f0: 520 + Math.random() * 340, t, dur: 0.028, gain: 0.14, attack: 0.001 });
      noise(ctx, out, { t, dur: 0.012, gain: 0.1, type: 'highpass', f0: 3000, attack: 0.0005 });
    },
    yes(ctx, out, t) {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => osc(ctx, out, { type: 'square', f0: f, t: t + i * 0.065, dur: 0.09, gain: 0.17, attack: 0.002 }));
      osc(ctx, out, { type: 'triangle', f0: 1046.5, t: t + 0.33, dur: 0.5, gain: 0.16, attack: 0.01 });
    },
    complete(ctx, out, t) {
      [880, 1318.5, 1760].forEach((f, i) => osc(ctx, out, { type: 'square', f0: f, t: t + i * 0.07, dur: 0.12, gain: 0.16, attack: 0.002 }));
    },
    denied(ctx, out, t) {
      osc(ctx, out, { type: 'sawtooth', f0: 98, f1: 90, t, dur: 0.55, gain: 0.3, attack: 0.004, lp: 900 });
      osc(ctx, out, { type: 'square', f0: 104, f1: 96, t, dur: 0.55, gain: 0.16, attack: 0.004, lp: 900 });
      [392, 370, 349, 330].forEach((f, i) => osc(ctx, out, { type: 'square', f0: f, t: t + 0.12 + i * 0.17, dur: 0.16, gain: 0.12, attack: 0.003 }));
      osc(ctx, out, { type: 'sawtooth', f0: 196, f1: 49, t: t + 0.82, dur: 0.9, gain: 0.25, attack: 0.01, lp: 700 });
    },
    whoosh(ctx, out, t) {
      noise(ctx, out, { t, dur: 1.0, gain: 0.36, type: 'bandpass', f0: 260, f1: 3400, q: 1.1, attack: 0.35 });
    },
    /* build-up to the blast */
    riser(ctx, out, t, dur = 2.2) {
      noise(ctx, out, { t, dur, gain: 0.26, type: 'bandpass', f0: 240, f1: 6500, q: 2.2, attack: dur * 0.92 });
      osc(ctx, out, { type: 'sawtooth', f0: 55, f1: 330, t, dur, gain: 0.15, attack: dur * 0.92, lp: 1400 });
      osc(ctx, out, { type: 'square', f0: 110, f1: 660, t, dur, gain: 0.05, attack: dur * 0.92, lp: 2400 });
      [0, 0.62, 1.14, 1.56, 1.84, 2.02].filter(d => d < dur - 0.08).forEach((d, i) => {
        osc(ctx, out, { type: 'sine', f0: 92, f1: 42, t: t + d, dur: 0.22, gain: 0.36 + i * 0.04, attack: 0.004 });
        noise(ctx, out, { t: t + d, dur: 0.05, gain: 0.12, type: 'lowpass', f0: 600, attack: 0.001 });
      });
    },
    /* the blast: soft-clipped and compressed so it is loud but round, then a long reverb tail */
    explosion(ctx, out, t) {
      const pre = ctx.createGain(); pre.gain.value = 0.5;
      const sh = ctx.createWaveShaper(); sh.curve = softClip; sh.oversample = '2x';
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 20; comp.ratio.value = 10; comp.attack.value = 0.002; comp.release.value = 0.45;
      const trim = ctx.createGain(); trim.gain.value = 1.3;
      pre.connect(sh); sh.connect(comp); comp.connect(trim); trim.connect(out);
      noise(ctx, pre, { t, dur: 0.06, gain: 1.0, type: 'bandpass', f0: 2200, q: 0.6, attack: 0.0006 });
      noise(ctx, pre, { t, dur: 3.2, gain: 1.1, type: 'lowpass', f0: 5200, f1: 70, q: 0.5, attack: 0.004 });
      noise(ctx, pre, { t: t + 0.03, dur: 1.8, gain: 0.6, type: 'bandpass', f0: 900, f1: 160, q: 0.8, attack: 0.01 });
      osc(ctx, pre, { type: 'sine', f0: 105, f1: 30, t, dur: 2.4, gain: 1.1, attack: 0.006 });
      osc(ctx, pre, { type: 'sine', f0: 60, f1: 24, t, dur: 3.6, gain: 1.0, attack: 0.012 });
      osc(ctx, pre, { type: 'sawtooth', f0: 150, f1: 42, t, dur: 1.8, gain: 0.5, attack: 0.004, lp: 520 });
      for (let i = 0; i < 34; i++) {
        const dt = 0.14 + Math.pow(Math.random(), 1.5) * 2.7;
        noise(ctx, pre, { t: t + dt, dur: 0.04 + Math.random() * 0.09, gain: (0.12 + Math.random() * 0.2) * (1 - dt / 3.3), type: 'bandpass', f0: 700 + Math.random() * 3600, q: 1.4, attack: 0.001 });
      }
      const conv = ctx.createConvolver(); conv.buffer = impulse(ctx, 3.8, 2.6);
      const send = ctx.createGain();
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      const wet = ctx.createGain(); wet.gain.value = 0.5;
      noise(ctx, send, { t, dur: 1.0, gain: 0.9, type: 'lowpass', f0: 3200, f1: 240, attack: 0.004 });
      send.connect(conv); conv.connect(lp); lp.connect(wet); wet.connect(pre);
    },
  };
})();

const Sound = (() => {
  let ctx = null, master = null, bus = null;
  function unlock() {
    if (!ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC({ latencyHint: 'interactive' });
        master = ctx.createGain();
        master.gain.value = state.muted ? 0 : state.sfxVol;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
        bus = ctx.createGain(); bus.gain.value = 0.9;
        bus.connect(comp); comp.connect(master); master.connect(ctx.destination);
      } catch (e) { ctx = null; return; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  }
  function play(name, ...args) {
    if (!ctx || !Synth[name]) return;
    try { Synth[name](ctx, bus, ctx.currentTime + 0.004, ...args); } catch (e) { /* sound is optional */ }
  }
  function sync() { if (master) master.gain.setTargetAtTime(state.muted ? 0 : state.sfxVol, ctx.currentTime, 0.02); }
  return { unlock, play, sync };
})();

/* ════════ MUSIC: streams the soundtrack, fades, ducks under the blast ════════ */
const Music = (() => {
  const E = new Map();
  let duckMul = 1, duckTarget = 1, duckTau = 0.3;
  let wanted = null, primed = false, timer = 0, last = performance.now(), blocked = false;
  const nudge = $('#sound-nudge');

  function entry(url) {
    let e = E.get(url);
    if (!e) {
      const el = new Audio();
      el.preload = 'auto'; el.loop = true; el.src = url; el.volume = 0;
      e = { el, url, mul: 0, target: 0, tau: 0.5 };
      E.set(url, e);
    }
    return e;
  }
  const seam = el => {
    const d = el.duration, t = el.currentTime;
    if (!isFinite(d) || d < 12) return 1;
    return clamp((d - t) / 3.2) * clamp(t / 0.8);
  };
  function tick() {
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    duckMul += (duckTarget - duckMul) * (1 - Math.exp(-dt / duckTau));
    for (const e of E.values()) {
      e.mul += (e.target - e.mul) * (1 - Math.exp(-dt / e.tau));
      if (e.target === 0 && e.mul < 0.004 && !e.el.paused) e.el.pause();
      const v = state.muted ? 0 : clamp(state.musicVol * duckMul * e.mul * seam(e.el));
      if (Math.abs(e.el.volume - v) > 0.002) e.el.volume = v;
    }
  }
  const ensureLoop = () => { if (!timer) timer = setInterval(tick, 33); };
  const showNudge = () => { blocked = true; if (nudge) nudge.hidden = false; };
  const hideNudge = () => { blocked = false; if (nudge) nudge.hidden = true; };

  return {
    preload() { entry(CONFIG.audio.intro); entry(CONFIG.audio.main); ensureLoop(); },
    /* call inside the first user gesture so later play() calls are allowed everywhere (Safari included) */
    async prime() {
      if (primed) return; primed = true;
      const ps = [];
      for (const e of E.values()) {
        try { e.el.muted = true; const p = e.el.play(); if (p) ps.push(p.catch(() => {})); } catch (_) { /* ignore */ }
      }
      await Promise.all(ps);
      for (const e of E.values()) {
        e.el.muted = state.muted;
        if (e !== wanted && e.target === 0) { try { e.el.pause(); e.el.currentTime = 0; } catch (_) { /* ignore */ } }
      }
    },
    whenReady(url, ms = 6000) {
      const e = entry(url);
      return new Promise(res => {
        if (e.el.readyState >= 3) return res(true);
        const done = ok => { clearTimeout(to); e.el.removeEventListener('canplaythrough', yes); e.el.removeEventListener('error', no); res(ok); };
        const yes = () => done(true), no = () => done(false);
        const to = setTimeout(() => done(false), ms);
        e.el.addEventListener('canplaythrough', yes); e.el.addEventListener('error', no);
      });
    },
    async start(which, opts = {}) {
      const { fade = 1.6, restart = false } = opts;
      const e = entry(CONFIG.audio[which]);
      ensureLoop();
      for (const o of E.values()) if (o !== e) { o.target = 0; o.tau = 0.7; }
      e.target = 1; e.tau = fade / 3;
      wanted = e;
      if (restart) { try { e.el.currentTime = 0; e.mul = 0; } catch (_) { /* ignore */ } }
      if (e.el.paused) {
        try { e.el.muted = state.muted; await e.el.play(); hideNudge(); } catch (err) { showNudge(); }
      }
    },
    retry() {
      if (!wanted || !wanted.el.paused) { hideNudge(); return; }
      wanted.el.play().then(hideNudge).catch(showNudge);
    },
    get blocked() { return blocked; },
    duck(level, ms = 400) { duckTarget = level; duckTau = Math.max(0.01, ms / 3000); },
    setMuted() { for (const e of E.values()) e.el.muted = state.muted; },
  };
})();

/* ════════ PERF GUARD: if frames get slow, the expensive extras switch themselves off ════════ */
const Perf = (() => {
  let raf = 0, last = 0, avg = 16.7, low = false;
  function loop(now) {
    raf = requestAnimationFrame(loop);
    const d = now - last; last = now;
    if (d <= 0 || d > 400 || !(state.scene === 'intro' || state.scene === 'boom' || state.scene === 'menu')) return;
    avg += (Math.min(d, 200) - avg) * 0.08;
    if (!low && avg > 38) { low = true; app.classList.add('lowfx'); }          // sustained under ~26 fps
  }
  return {
    start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } },
    get low() { return low || REDUCED; },
    get fps() { return Math.round(1000 / avg); },
  };
})();

/* ════════ FX: dust motes, glowing cracks, sparks, smoke ════════ */
const FX = (() => {
  const cv = $('#fx'), g = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, running = false, last = 0;
  let motes = [], sparks = [], puffs = [], cracks = null, crackT = 0, crackDur = 2, ambientOn = false;

  function sprite(r, gc, b, a) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, `rgba(${r},${gc},${b},${a})`); gr.addColorStop(1, `rgba(${r},${gc},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
    return c;
  }
  const dust = sprite(78, 54, 104, 0.6), ember = sprite(255, 150, 60, 0.9);

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    motes = Array.from({ length: W < 700 ? 26 : 52 }, () => ({
      x: Math.random() * W, y: Math.random() * H, vx: rand(-6, 6), vy: rand(-14, -3),
      s: Math.random() < 0.25 ? 3 : 2, a: rand(0.15, 0.6), ph: Math.random() * 6.28,
      c: ['255,255,255', '0,240,255', '255,42,138'][Math.floor(Math.random() * 3)],
    }));
  }

  function makeCracks(cx, cy) {
    const diag = Math.hypot(W, H), list = [], n = 11;
    const polyline = (x, y, a0, len, minStep, maxStep, wobble) => {
      const pts = [[x, y]], segs = []; let a = a0, d = 0;
      while (d < len) {
        const step = rand(minStep, maxStep); a += (Math.random() - 0.5) * wobble;
        const p = pts[pts.length - 1];
        pts.push([p[0] + Math.cos(a) * step, p[1] + Math.sin(a) * step]); segs.push(step); d += step;
      }
      return { pts, segs, len: d };
    };
    for (let k = 0; k < n; k++) {
      const a0 = (k / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      const main = polyline(cx, cy, a0, diag * rand(0.2, 0.5), 26, 78, 0.9);
      main.delay = 0; list.push(main);
      let acc = 0;
      for (let i = 1; i < main.pts.length; i++) {
        acc += main.segs[i - 1];
        if (acc > 70 && Math.random() < 0.28) {
          const p = main.pts[i], side = Math.random() < 0.5 ? -1 : 1;
          const br = polyline(p[0], p[1], a0 + side * rand(0.5, 1.1), rand(50, diag * 0.16), 16, 44, 0.9);
          br.delay = clamp(acc / main.len) * 0.75; list.push(br);
        }
      }
    }
    return list;
  }

  function drawMotes(dt, now) {
    for (const m of motes) {
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
      if (m.x < -4) m.x = W + 4; if (m.x > W + 4) m.x = -4;
      const a = m.a * (0.55 + 0.45 * Math.sin(now / 900 + m.ph));
      g.fillStyle = `rgba(${m.c},${a.toFixed(3)})`;
      g.fillRect(Math.round(m.x), Math.round(m.y), m.s, m.s);
    }
  }
  function drawCracks(p) {
    g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
    const fl = 0.78 + Math.random() * 0.22;
    for (const c of cracks) {
      const local = clamp((p - c.delay) / (1 - c.delay));
      if (local <= 0) continue;
      const target = c.len * local;
      g.beginPath(); g.moveTo(c.pts[0][0], c.pts[0][1]);
      let acc = 0;
      for (let i = 1; i < c.pts.length; i++) {
        const seg = c.segs[i - 1];
        if (acc + seg <= target) { g.lineTo(c.pts[i][0], c.pts[i][1]); acc += seg; }
        else { const f = (target - acc) / seg, a = c.pts[i - 1], b = c.pts[i]; g.lineTo(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f); break; }
      }
      g.strokeStyle = `rgba(255,42,138,${0.22 * fl})`; g.lineWidth = 11; g.stroke();
      g.strokeStyle = `rgba(0,240,255,${0.45 * fl})`; g.lineWidth = 5; g.stroke();
      g.strokeStyle = `rgba(225,253,255,${0.95 * fl})`; g.lineWidth = 2; g.stroke();
    }
    g.restore();
  }
  function drawSparks(dt) {
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i]; s.life += dt;
      if (s.life > s.max) { sparks.splice(i, 1); continue; }
      s.px = s.x; s.py = s.y; s.vy += 900 * dt; s.vx *= 0.992; s.x += s.vx * dt; s.y += s.vy * dt;
      const k = 1 - s.life / s.max;
      g.strokeStyle = `rgba(255,${Math.round(150 + 105 * k)},${Math.round(60 + 120 * k * k)},${(k * 0.95).toFixed(3)})`;
      g.lineWidth = 1 + 2 * k; g.beginPath(); g.moveTo(s.px, s.py); g.lineTo(s.x, s.y); g.stroke();
    }
    g.restore();
  }
  function drawPuffs(dt) {
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i]; p.life += dt;
      if (p.life > p.max) { puffs.splice(i, 1); continue; }
      const k = p.life / p.max; p.x += p.vx * dt; p.y += p.vy * dt;
      const r = p.r * (0.5 + 1.7 * Math.sqrt(k));
      g.globalAlpha = (1 - k) * 0.65; g.drawImage(dust, p.x - r, p.y - r, r * 2, r * 2);
      if (p.warm && k < 0.35) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = (1 - k / 0.35) * 0.45; g.drawImage(ember, p.x - r, p.y - r, r * 2, r * 2); g.globalCompositeOperation = 'source-over'; }
    }
    g.globalAlpha = 1;
  }
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    g.clearRect(0, 0, W, H);
    if (ambientOn) drawMotes(dt, now);
    if (cracks) { crackT += dt; drawCracks(clamp(crackT / crackDur)); }
    if (sparks.length) drawSparks(dt);
    if (puffs.length) drawPuffs(dt);
    if (ambientOn || cracks || sparks.length || puffs.length) requestAnimationFrame(loop);
    else { running = false; g.clearRect(0, 0, W, H); }
  }
  function start() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(loop); }

  window.addEventListener('resize', resize);
  resize();

  return {
    ambient(on) { ambientOn = on; if (on) start(); },
    cracks(secs) { crackDur = secs; crackT = 0; cracks = makeCracks(W / 2, H / 2); start(); },
    blast(cx, cy) {
      cracks = null;
      const q = Perf.low ? 0.4 : 1;
      for (let i = 0; i < Math.round(170 * q); i++) {
        const a = Math.random() * 6.283, sp = 300 + Math.pow(Math.random(), 0.6) * 1500;
        sparks.push({ x: cx, y: cy, px: cx, py: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, life: 0, max: rand(0.5, 1.6) });
      }
      for (let i = 0; i < Math.round(30 * q); i++) {
        puffs.push({ x: cx + rand(-0.38, 0.38) * W, y: cy + rand(-0.32, 0.32) * H, r: rand(70, 190), vx: rand(-40, 40), vy: rand(-70, -15), life: 0, max: rand(1.8, 3.4), warm: Math.random() < 0.55 });
      }
      start();
    },
    reset() { cracks = null; sparks = []; puffs = []; ambientOn = false; g.clearRect(0, 0, W, H); },
  };
})();

/* ════════ SHAKE: jolts the stage and the cave together ════════ */
const Shake = (() => {
  const els = [$('#stage'), $('#bg')];
  let amp = 0, target = 0, raf = 0, last = 0, applied = 0, decay = false;
  function loop(now) {
    if (Perf.low) { els.forEach(e => { e.style.transform = ''; }); raf = 0; return; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (decay) amp *= Math.exp(-dt * 3.2); else amp += (target - amp) * (1 - Math.exp(-dt * 6));
    if (amp < 0.15 && target === 0) { els.forEach(e => { e.style.transform = ''; }); raf = 0; return; }
    if (now - applied >= 30) {
      applied = now;
      const x = (Math.random() * 2 - 1) * amp, y = (Math.random() * 2 - 1) * amp;
      els.forEach(e => { e.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`; });
    }
    raf = requestAnimationFrame(loop);
  }
  const go = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } };
  return {
    to(a) { if (REDUCED) return; target = a; decay = false; go(); },
    kick(a) { if (REDUCED) return; amp = a; target = 0; decay = true; go(); },
    stop() { target = 0; amp = 0; decay = false; },
  };
})();

/* ════════ THE CAVE: pixel-art shelves of games lit by neon strips ════════ */
const Shelves = (() => {
  const cv = $('#shelves');
  const NEON = ['#00f0ff', '#ff2a8a', '#fcee0a'];
  const HUES = [262, 282, 318, 196, 172, 46, 350, 222];

  function spine(g, x, y, w, h, R) {
    const hu = HUES[Math.floor(R() * HUES.length)], bright = R() < 0.07;
    g.fillStyle = `hsl(${hu},${bright ? 88 : 38 + R() * 34}%,${bright ? 52 : 16 + R() * 16}%)`;
    g.fillRect(x, y, w, h);
    if (R() < 0.65) { g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(x, y + 2 + Math.floor(R() * Math.max(1, h - 5)), w, 1); }
    if (R() < 0.4) { g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x + w - 1, y, 1, h); }
    if (R() < 0.3) { g.fillStyle = `hsl(${(hu + 40) % 360},80%,60%)`; g.fillRect(x, y, w, 1); }
  }
  function consoleBlock(g, x, y, w, h, R) {
    g.fillStyle = '#2a2147'; g.fillRect(x, y, w, h);
    g.fillStyle = '#3a2f63'; g.fillRect(x, y, w, 1);
    g.fillStyle = '#120a22'; g.fillRect(x + 2, y + 2, Math.max(2, w - 8), 1); g.fillRect(x + 1, y + h - 2, 3, 1);
    g.fillStyle = R() < 0.5 ? '#00f0ff' : '#ff2a8a'; g.fillRect(x + w - 3, y + h - 3, 1, 1);
  }
  function screen(g, x, y, w, h, R) {
    const hue = R() < 0.5 ? 186 : 322;
    g.fillStyle = `hsla(${hue},95%,60%,.16)`; g.fillRect(x - 1, y - 1, w + 2, h + 2);
    g.fillStyle = '#161029'; g.fillRect(x, y, w, h);
    g.fillStyle = `hsl(${hue},95%,${40 + R() * 14}%)`; g.fillRect(x + 1, y + 1, w - 2, h - 3);
    g.fillStyle = 'rgba(0,0,0,.3)';
    for (let yy = y + 2; yy < y + h - 2; yy += 2) g.fillRect(x + 1, yy, w - 2, 1);
  }

  function draw() {
    const W = innerWidth + 56, H = innerHeight + 56;           // #bg overhangs the viewport by 28px per side
    const k = W > 1100 ? 4 : 3;
    const w = Math.ceil(W / k), h = Math.ceil(H / k);
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d'), R = mulberry32(20261123);
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#0b0619'); grad.addColorStop(1, '#16092f');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.025)';
    for (let x = 0; x < w; x += Math.round(w / 9)) g.fillRect(x, 0, 1, h);

    const tiers = Math.max(5, Math.round(h / 30)), tier = Math.floor(h / tiers);
    for (let ti = 0; ti < tiers; ti++) {
      const yb = (ti + 1) * tier - 3;
      let x = Math.floor(R() * 5);
      while (x < w) {
        const r = R();
        if (r < 0.07) { x += 3 + Math.floor(R() * 9); continue; }
        if (r < 0.12) { const cw = 15 + Math.floor(R() * 9), ch = 5 + Math.floor(R() * 3); consoleBlock(g, x, yb - ch, cw, ch, R); x += cw + 2; continue; }
        if (r < 0.155) { const ch = Math.min(tier - 6, 13); screen(g, x, yb - ch, 15, ch, R); x += 17; continue; }
        const sw = 2 + Math.floor(R() * 3), sh = Math.max(6, Math.round((tier - 5) * (0.5 + R() * 0.5)));
        spine(g, x, yb - sh, sw, sh, R); x += sw + (R() < 0.18 ? 1 : 0);
      }
      g.fillStyle = '#1b1038'; g.fillRect(0, yb, w, 2);
      g.fillStyle = '#0a0518'; g.fillRect(0, yb + 2, w, 1);
      g.fillStyle = NEON[ti % 3];
      g.globalAlpha = 0.9; g.fillRect(0, yb + 3, w, 1);
      g.globalAlpha = 0.24; g.fillRect(0, yb + 4, w, 1);
      g.globalAlpha = 0.1; g.fillRect(0, yb + 5, w, 1);
      g.globalAlpha = 1;
    }
  }
  return { draw };
})();

/* ════════ THE WALL: pixel-art brick wall over the title; blown apart brick by brick ════════ */
const Wall = (() => {
  const cv = $('#wall'), g = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, u = 4, sprite = null, pieces = [], exploded = false;

  function brick(s, x, y, w, h, R) {
    const violet = R() < 0.12;
    const hue = (violet ? 255 + R() * 30 : 352 + R() * 26) % 360;
    const sat = violet ? 30 + R() * 15 : 34 + R() * 16, l = 15 + R() * 9;
    s.fillStyle = `hsl(${hue},${sat}%,${l}%)`; s.fillRect(x, y, w, h);
    s.fillStyle = `hsl(${hue},${sat}%,${l + 7}%)`; s.fillRect(x, y, w, 1);
    s.fillStyle = `hsl(${hue},${sat}%,${Math.max(6, l - 8)}%)`; s.fillRect(x, y + h - 1, w, 1);
    const specks = Math.round(w * h / 38);
    for (let i = 0; i < specks; i++) {
      s.fillStyle = R() < 0.5 ? 'rgba(0,0,0,.28)' : 'rgba(255,200,170,.12)';
      s.fillRect(x + Math.floor(R() * w), y + Math.floor(R() * h), R() < 0.2 ? 2 : 1, 1);
    }
    if (R() < 0.08) s.clearRect(x + w - 3, y, 3, 2);            // chipped corner: light leaks through later
  }

  function build() {
    exploded = false;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.display = '';
    u = Math.max(3, Math.round(W / 380));                         // css px per art pixel
    const lw = Math.ceil(W / u), lh = Math.ceil(H / u);
    sprite = document.createElement('canvas'); sprite.width = lw; sprite.height = lh;
    const s = sprite.getContext('2d');
    const bw = clamp(Math.round(lw / 11), 22, 40), bh = Math.round(bw * 0.44);
    const R = mulberry32(1977);
    pieces = [];
    const rows = Math.ceil(lh / bh) + 1;
    for (let r = 0; r < rows; r++) {
      let x = (r % 2) ? -Math.round(bw / 2) : 0;                  // running bond
      for (; x < lw; x += bw) {
        const x0 = Math.max(0, x), x1 = Math.min(lw, x + bw), y0 = r * bh, y1 = Math.min(lh, (r + 1) * bh);
        if (x1 - x0 < 4 || y1 - y0 < 4) continue;
        brick(s, x0, y0, x1 - x0 - 1, y1 - y0 - 1, R);            // 1px of transparent mortar right + below
        pieces.push({ sx: x0, sy: y0, sw: x1 - x0, sh: y1 - y0 });
      }
    }
    draw();
  }
  function draw() {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    g.imageSmoothingEnabled = false;
    g.drawImage(sprite, 0, 0, sprite.width, sprite.height, 0, 0, sprite.width * u, sprite.height * u);
  }

  function explode(done) {
    exploded = true;
    const cx = W * 0.5, cy = H * 0.5, maxd = Math.hypot(W, H) * 0.5;
    const bricks = pieces.map(p => {
      const w = p.sw * u, h = p.sh * u, x = p.sx * u + w / 2, y = p.sy * u + h / 2;
      const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1, k = clamp(d / maxd);
      const sp = lerp(2100, 650, k) * rand(0.75, 1.25);
      return { p, w, h, x, y, vx: dx / d * sp + rand(-80, 80), vy: dy / d * sp - rand(380, 1000), rot: 0, vr: rand(-7, 7), delay: k * 0.14 + Math.random() * 0.05 };
    });
    const t0 = performance.now();
    let last = t0, T = 0;
    function put(b, heat) {
      g.save(); g.translate(b.x, b.y); g.rotate(b.rot);
      g.drawImage(sprite, b.p.sx, b.p.sy, b.p.sw, b.p.sh, -b.w / 2, -b.h / 2, b.w, b.h);
      if (heat > 0 && !Perf.low) { g.globalCompositeOperation = 'lighter'; g.fillStyle = `rgba(255,${Math.round(110 + 60 * heat)},40,${(0.3 * heat).toFixed(3)})`; g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); }
      g.restore();
    }
    function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
      g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); g.imageSmoothingEnabled = false;
      let alive = 0;
      for (const b of bricks) {
        const tt = T - b.delay;
        if (tt < 0) { put(b, 0); alive++; continue; }
        b.vy += 2700 * dt; b.vx *= 0.996; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
        if (b.y - b.h > H + 90 || b.x < -300 || b.x > W + 300) continue;
        alive++; put(b, clamp(1 - tt / 0.5));
      }
      if (alive > 0 && T < 4.2 && now - t0 < 4200) requestAnimationFrame(step);        // wall-clock cap, so a slow device can't stall the reveal
      else { g.clearRect(0, 0, W, H); cv.style.display = 'none'; done && done(); }
    }
    requestAnimationFrame(step);
  }

  window.addEventListener('resize', () => { if (state.scene === 'intro' && !exploded) build(); });
  return { build, explode, get count() { return pieces.length; }, hide() { cv.style.display = 'none'; g.clearRect(0, 0, W, H); } };
})();

/* ───────── 1. the bouncer ───────── */
const Gate = (() => {
  const typed = $('#gate-typed'), actions = $('#gate-actions'), q = 'ARE YOU A GAMER?';
  let token = 0, ready = false;
  async function run() {
    const my = ++token; ready = false;
    setScene('gate');
    typed.textContent = ''; actions.classList.remove('on');
    await sleep(500); if (my !== token) return;
    for (let i = 1; i <= q.length; i++) {
      typed.textContent = q.slice(0, i); Sound.play('type');
      await sleep(q[i - 1] === ' ' ? 130 : rand(58, 96)); if (my !== token) return;
    }
    await sleep(220); if (my !== token) return;
    actions.classList.add('on'); ready = true;
    $('#btn-yes').focus({ preventScroll: true });
  }
  return { run, get ready() { return ready; } };
})();

async function onYes() {
  if (state.busy || !Gate.ready) return;
  state.busy = true;
  Sound.unlock(); Music.prime(); Sound.play('yes');
  setScene('loading');
  await Loader.run();
  await startIntro();
  state.busy = false;
}
async function onNo() {
  if (state.busy || !Gate.ready) return;
  state.busy = true;
  Sound.unlock(); Sound.play('denied');
  const d = $('#denied');
  d.classList.remove('out'); setScene('denied');

  d.classList.add('out'); await sleep(520);
  d.classList.remove('out');

/* ───────── 2. classic progress bar ───────── */
const Loader = (() => {
  const bar = $('#bar'), pct = $('#pct'), log = $('#boot-log'), N = 24;
  const LINES = [[0, 'WAKING THE CONSOLES'], [16, 'BLOWING DUST OFF THE CARTRIDGES'], [34, 'CHARGING CONTROLLERS'],
    [52, 'CHECKING YOU EARNED THIS'], [70, 'TUNING THE SOUNDTRACK'], [88, 'OPENING THE DEN']];
  const KEYS = [[0, 0], [0.16, 20], [0.28, 23], [0.5, 57], [0.62, 60], [0.84, 91], [1, 96]];   // two stalls, like a real install
  const at = t => { for (let i = 1; i < KEYS.length; i++) if (t <= KEYS[i][0]) { const a = KEYS[i - 1], b = KEYS[i]; return lerp(a[1], b[1], (t - a[0]) / (b[0] - a[0])); } return 96; };
  async function run() {
    if (!bar.children.length) for (let i = 0; i < N; i++) bar.appendChild(document.createElement('i'));
    const segs = Array.from(bar.children); segs.forEach(s => s.classList.remove('on'));
    log.textContent = ''; pct.textContent = '0%';
    const ready = Music.whenReady(CONFIG.audio.intro, 6500);
    let p = 0, shown = 0, li = 0;
    const paint = () => {
      const n = Math.floor(p / 100 * N);
      for (let i = 0; i < n; i++) segs[i].classList.add('on');
      if (n > shown) { shown = n; Sound.play('blip', 280 + n * 36, 0.03, 0.07); }
      while (li < LINES.length && p >= LINES[li][0]) {
        const prev = log.lastElementChild; if (prev) prev.classList.add('ok');
        const el = document.createElement('li'); el.textContent = LINES[li][1]; log.appendChild(el); li++;
      }
      pct.textContent = Math.floor(p) + '%';
    };
    const T = REDUCED ? 1400 : 3600, t0 = performance.now();
    await new Promise(res => { (function step(now) { const t = clamp((now - t0) / T); p = Math.max(p, at(t)); paint(); if (t < 1) requestAnimationFrame(step); else res(); })(t0); });
    await ready;                                                  // hold at 96% until the soundtrack is buffered (max ~6 s)
    const from = p;
    await tween(380, k => { p = lerp(from, 100, k); paint(); });
    if (log.lastElementChild) log.lastElementChild.classList.add('ok');
    Sound.play('complete');
    await sleep(560);
  }
  return { run };
})();

/* ───────── 3. title: from wall-sized hero to menu header ───────── */
const Title = {
  async shiftUp() {
    const menu = $('#menu'), sp = $$('#title span');
    const first = sp.map(s => s.getBoundingClientRect());
    menu.classList.add('compact');
    const last = sp.map(s => s.getBoundingClientRect());
    sp.forEach((s, i) => {
      const a = first[i], b = last[i];
      s.style.transition = 'none'; s.style.transformOrigin = '0 0';
      s.style.transform = `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})`;
    });

    sp.forEach(s => { s.style.transition = 'transform 1.2s cubic-bezier(.22,.9,.18,1)'; s.style.transform = 'none'; });

/* ───────── 4. the crawl: small at the bottom, biggest mid-screen, flowing up ───────── */
const Intro = (() => {
  const host = $('#crawl');
  let lines = [], W = 0, H = 0, y0 = 0, v = 0, S1 = 0, S_end = 0, dS = 0, t1 = 0, tail = 1, creep = 0, tDet = 0;
  let t = 0, raf = 0, lastT = 0, ended = false, onEnd = null;

  function tokenize(text) {
    const words = []; let cur = null, hl = false;
    text.split('*').forEach((part, pi) => {
      if (pi > 0) hl = !hl;
      part.split(/(\s+)/).forEach(pc => {
        if (!pc) return;
        if (/^\s+$/.test(pc)) { cur = null; return; }
        if (!cur) { cur = { segs: [], w: '' }; words.push(cur); }
        cur.segs.push({ t: pc, hl }); cur.w += pc;
      });
    });
    return words;
  }
  function layout() {
    W = innerWidth; H = innerHeight;
    const fs = clamp(Math.round(Math.min(W / 17, H / 12.5)), 20, 54);
    const maxW = Math.min(W * 0.9, 1500);
    const mc = document.createElement('canvas').getContext('2d');
    host.querySelectorAll('.cl').forEach(n => n.remove());
    lines = [];
    let y = 0, words = 0;
    STORY.forEach(p => {
      const size = Math.round(p.final ? fs * 1.5 : fs), lsEm = p.final ? 0.09 : 0.06, ls = size * lsEm, rowH = Math.round(size * 1.8);
      mc.font = `${size}px DanPixel`;
      const meas = s => mc.measureText(s).width + s.length * ls;
      const sp = meas(' ');
      const toks = tokenize(p.text); words += toks.length;
      const rows = []; let cur = [], cw = 0;
      toks.forEach(tk => {
        const tw = meas(tk.w);
        if (cur.length && cw + sp + tw > maxW) { rows.push(cur); cur = []; cw = 0; }
        cw += (cur.length ? sp : 0) + tw; cur.push(tk);
      });
      if (cur.length) rows.push(cur);
      rows.forEach((row, ri) => {
        const el = document.createElement('div');
        el.className = 'cl' + (p.final ? ' fin' : '');
        el.style.cssText = `font-size:${size}px;line-height:${rowH}px;height:${rowH}px;letter-spacing:${lsEm}em`;
        el.innerHTML = row.map(w => w.segs.map(s => s.hl ? `<span class="hl">${s.t}</span>` : s.t).join('')).join(' ') +
          (p.dots && ri === rows.length - 1 ? '<span class="dots">' + Array.from({ length: p.dots }, (_, n) => `<i style="--n:${n}">.</i>`).join('') + '</span>' : '');
        host.appendChild(el);
        lines.push({ el, y: y + rowH / 2, h: rowH, w: 0, on: false });
        y += rowH;
      });
      y += Math.round(fs * (p.lead ? 1.5 : 2.1));
    });
    lines.forEach(L => { L.w = L.el.offsetWidth; });
    const wpl = words / lines.length, secPerLine = clamp(0.33 * wpl, 1.5, 2.3);
    v = (lines.reduce((a, L) => a + L.h, 0) / lines.length) / secPerLine;
    const last = lines[lines.length - 1];
    y0 = H * 0.96;
    S_end = y0 + last.y - H * 0.5;
    dS = H * 0.16; S1 = S_end - dS; t1 = S1 / v; tail = 2 * dS / v; creep = v * 0.05;
    tDet = t1 + tail + 0.8;
  }
  const scrollAt = tt => {
    if (tt <= t1) return v * tt;
    const k = (tt - t1) / tail;
    if (k < 1) return S1 + dS * (1 - (1 - k) * (1 - k));            // ease the last line to rest mid-screen
    return S_end + creep * (tt - t1 - tail);
  };
  function paint() {
    const S = scrollAt(t), cx = W / 2;
    for (const L of lines) {
      const cy = y0 + L.y - S, u = 1 - cy / H;
      if (u < -0.12 || u > 1.12) { if (L.on) { L.el.style.opacity = '0'; L.on = false; } continue; }
      const s = lerp(0.3, 1, smooth(0.02, 0.56, u));                  // apex at the bottom, full size by mid-screen
      const a = smooth(0, 0.13, u) * (1 - smooth(0.72, 0.98, u));
      L.el.style.transform = `translate3d(${(cx - L.w / 2).toFixed(1)}px,${(cy - L.h / 2).toFixed(1)}px,0) scale(${s.toFixed(3)})`;
      L.el.style.opacity = a.toFixed(3); L.on = true;
    }
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; t += dt;
    paint();
    if (!ended && t >= tDet) { ended = true; onEnd && onEnd(); }
  }
  window.addEventListener('resize', () => { if (raf) { layout(); paint(); } });
  return {
    prepare() { host.style.display = ''; layout(); paint(); },
    start(cb) { onEnd = cb; ended = false; t = 0; lastT = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); },
    skip() { if (!ended) { t = Math.max(t, tDet); ended = true; paint(); onEnd && onEnd(); } },
    stop() { cancelAnimationFrame(raf); raf = 0; },
    seek(sec) { t = sec; paint(); },
    get duration() { return tDet; },
  };
})();

async function startIntro() {
  Title.reset();
  app.classList.remove('charged');
  Shake.stop(); FX.reset();
  Wall.build(); Intro.prepare();
  FX.ambient(true);
  setScene('intro');
  Music.start('intro', { restart: true });
  setTimeout(() => $('#skip').classList.add('show'), 1200);
  await sleep(REDUCED ? 600 : 1000);

}

function flash() {

}

async function detonate() {

/* ════════ GALLERY ART: procedural pixel scenes, stand-ins until Dan adds real photos ════════ */
const Art = (() => {
  const PAL = [
    { sky: ['#0b0620', '#241048', '#6b1a63', '#d02a7e'], glow: '#00f0ff', alt: '#fcee0a', pink: '#ff2a8a' },
    { sky: ['#14082e', '#4d1a6b', '#b8326c', '#ff8f3c'], glow: '#fcee0a', alt: '#ff2a8a', pink: '#ff5aa5' },
    { sky: ['#04102a', '#0a3050', '#0f6a86', '#19d6e6'], glow: '#00f0ff', alt: '#fcee0a', pink: '#ff2a8a' },
  ];
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const rc = (g, c, x, y, w, h) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  const dot = (g, c, x, y) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); };
  const fade = (g, a, fn) => { const o = g.globalAlpha; g.globalAlpha = a; fn(); g.globalAlpha = o; };
  const pick = (R, arr) => arr[Math.floor(R() * arr.length)];

  function sky(g, P, h) {
    const n = P.sky.length, bh = h / n;
    for (let i = 0; i < n; i++) {
      const y0 = Math.round(i * bh), y1 = Math.round((i + 1) * bh);
      rc(g, P.sky[i], 0, y0, 160, y1 - y0);
      if (i) for (let d = 0; d < 4; d++) for (let x = 0; x < 160; x++) {      // dithered seam between bands
        if (BAYER[(d & 3) * 4 + (x & 3)] < (4 - d) * 3) dot(g, P.sky[i - 1], x, y0 + d);
      }
    }
  }
  function blocks(g, R, o) {
    let x = -4;
    while (x < 160) {
      const w = o.w[0] + Math.floor(R() * (o.w[1] - o.w[0])), h = o.h[0] + Math.floor(R() * (o.h[1] - o.h[0])), top = o.base - h;
      rc(g, o.c, x, top, w, h);
      if (o.edge) rc(g, o.edge, x, top, w, 1);
      if (o.ant && R() < 0.35) rc(g, o.c, x + Math.floor(w / 2), top - 5, 1, 5);
      for (let wy = top + 3; wy < o.base - 2; wy += 3) for (let wx = x + 2; wx < x + w - 2; wx += 3) if (R() < o.lit) dot(g, pick(R, o.cols), wx, wy);
      x += w;
    }
  }

  function skyline(g, P, R) {
    sky(g, P, 74);
    for (let i = 0; i < 28; i++) fade(g, 0.35 + R() * 0.65, () => dot(g, '#fff', R() * 160, R() * 36));
    const cx = 108, cy = 56, r = 18;
    for (let y = -r; y <= r; y++) {                                           // retro sun with slats
      if (y > 2 && (y + r) % 5 < Math.floor(y / 4)) continue;
      const w = Math.floor(Math.sqrt(r * r - y * y));
      rc(g, y < -5 ? P.alt : y < 5 ? '#ff9a3c' : P.pink, cx - w, cy + y, w * 2, 1);
    }
    blocks(g, R, { c: '#2a1a5c', base: 76, h: [14, 36], w: [8, 15], lit: 0.1, cols: ['#6f5fd0', P.glow] });
    blocks(g, R, { c: '#0d0720', edge: '#3a2a78', base: 80, h: [22, 54], w: [11, 21], lit: 0.3, cols: [P.glow, P.pink, P.alt], ant: true });
    [[16, 52, 13, 4, P.pink], [88, 46, 10, 4, P.glow], [128, 58, 14, 4, P.alt]].forEach(([x, y, w, h, c]) => {
      fade(g, 0.28, () => rc(g, c, x - 2, y - 2, w + 4, h + 4)); rc(g, c, x, y, w, h);
    });
    rc(g, '#0a0518', 0, 80, 160, 20);                                         // water
    for (let y = 81; y < 100; y++) {
      const t = (y - 80) / 20, w = 26 - t * 8 + Math.sin(y * 1.7) * 4, off = Math.round(Math.sin(y * 0.9) * 3);
      if (y % 2) fade(g, 0.6 - t * 0.4, () => rc(g, y % 4 === 1 ? P.pink : P.alt, cx - w / 2 + off, y, w, 1));
    }
    for (let i = 0; i < 22; i++) fade(g, 0.18 + R() * 0.2, () => rc(g, pick(R, [P.glow, P.pink, P.alt]), R() * 160, 82 + R() * 18, 2 + R() * 6, 1));
  }

  function shelf(g, P, R) {
    rc(g, '#0d0719', 0, 0, 160, 100);
    for (let i = 0; i < 4; i++) {
      const yb = 22 + i * 24;
      let x = 2 + Math.floor(R() * 4);
      while (x < 158) {
        const r = R();
        if (r < 0.06) { x += 3 + Math.floor(R() * 6); continue; }
        if (r < 0.14) {                                                       // console
          const w = 18 + Math.floor(R() * 8), h = 6 + Math.floor(R() * 3);
          rc(g, '#2d2352', x, yb - h, w, h); rc(g, '#4a4082', x, yb - h, w, 1); rc(g, '#120a22', x + 2, yb - h + 2, w - 9, 1);
          dot(g, R() < 0.5 ? P.glow : P.pink, x + w - 3, yb - 3); x += w + 2; continue;
        }
        if (r < 0.2) {                                                        // handheld CRT
          const w = 16, h = 14; rc(g, '#2a2147', x, yb - h, w, h); rc(g, P.glow, x + 2, yb - h + 2, w - 4, h - 5);
          fade(g, 0.45, () => { for (let yy = yb - h + 3; yy < yb - 3; yy += 2) rc(g, '#000', x + 2, yy, w - 4, 1); }); x += w + 2; continue;
        }
        const w = 3 + Math.floor(R() * 3), h = 13 + Math.floor(R() * 7), hu = Math.floor(R() * 360);
        rc(g, `hsl(${hu},${Math.round(40 + R() * 40)}%,${Math.round(22 + R() * 22)}%)`, x, yb - h, w, h);
        rc(g, 'rgba(255,255,255,.22)', x, yb - h + 2 + Math.floor(R() * (h - 6)), w, 1);
        if (R() < 0.35) rc(g, `hsl(${(hu + 160) % 360},80%,62%)`, x, yb - h, w, 1);
        x += w + (R() < 0.15 ? 1 : 0);
      }

    rc(g, '#2a2147', 30, 15, 100, 65); rc(g, '#4a4082', 30, 15, 100, 2); rc(g, '#16102c', 30, 78, 100, 2);                       // set
    rc(g, '#0e0820', 36, 21, 76, 53);
    const sx = 39, sy = 24, sw = 70, sh = 47;
    [P.sky[1], P.sky[2], P.sky[3]].forEach((c, i) => rc(g, c, sx, sy + i * 12, sw, 13));
    for (let x = 0; x < sw; x++) { const h = 7 + Math.round(5 * Math.sin(x / 8) + 3 * Math.sin(x / 3.7)); rc(g, '#170c36', sx + x, sy + 38 - h, 1, h + 9); }
    rc(g, '#1d1040', sx, sy + 38, sw, 9); rc(g, P.glow, sx, sy + 38, sw, 1);
    for (let x = sx + 3; x < sx + sw; x += 8) rc(g, '#2d1b66', x, sy + 40, 4, 1);

    [['.PPP.', 0], ['.FFF.', 1], ['VVVVV', 2], ['.VVV.', 3], ['.V.V.', 4], ['.D.D.', 5]].forEach(([row, y]) => {       // little hero
      for (let x = 0; x < 5; x++) { const c = { P: P.pink, F: '#ffd7b0', V: P.alt, D: '#0a0514' }[row[x]]; if (c) dot(g, c, sx + 44 + x, sy + 32 + y); }

    rc(g, '#4a4082', 116, 30, 8, 8); rc(g, '#16102c', 118, 32, 4, 4);
    rc(g, '#4a4082', 116, 42, 8, 8); rc(g, '#16102c', 118, 44, 4, 4);
    for (let y = 56; y < 70; y += 2) rc(g, '#16102c', 116, y, 8, 1);
    fade(g, 0.14, () => rc(g, P.glow, 30, 82, 100, 6));
    rc(g, '#2d2352', 6, 84, 36, 8); rc(g, '#4a4082', 6, 84, 36, 1); rc(g, '#0e0820', 10, 87, 22, 1); dot(g, P.pink, 37, 89);           // console
    rc(g, '#3a2f63', 108, 87, 24, 9); rc(g, '#4a4082', 108, 87, 24, 1); rc(g, '#cfc7ff', 113, 90, 5, 1); rc(g, '#cfc7ff', 115, 88, 1, 5);
    dot(g, P.pink, 124, 91); dot(g, P.alt, 127, 90);                                                                                    // pad
    rc(g, '#d02a7e', 138, 72, 12, 16); rc(g, '#8a1a58', 138, 72, 12, 2); rc(g, '#120a22', 140, 78, 8, 6);                              // cartridge
  }

  function cabinets(g, P, R) {
    rc(g, '#0a0518', 0, 0, 160, 100);
    [[12, P.glow], [20, P.pink]].forEach(([y, c]) => { rc(g, c, 0, y, 160, 1); fade(g, 0.22, () => rc(g, c, 0, y + 1, 160, 3)); });
    rc(g, '#150a2c', 0, 82, 160, 18);

    for (let x = 0; x < 160; x += 14) rc(g, '#1d1040', x, 82, 1, 18);

  }

  const SCENES = { skyline, shelf, crt, cabinets };
  /* draws a 160x100 scene scaled to the canvas, so any canvas width that is a multiple of 160 stays crisp */
  function draw(cv, kind, pal = 0, seed = 1) {

})();

/* ───────── the menu wall ───────── */
const Bricks = (() => {
  function build() {
    const nav = $('#bricks');
    nav.innerHTML = MODULES.map((m, i) =>
      `<button class="mod" type="button" data-id="${m.id}" style="--i:${i};--a:var(--${m.a});--glow:${m.glow}" aria-haspopup="dialog">` +
      `<span class="mod-in"><span class="mod-top">${pixIcon(m.icon, 4)}<span class="mod-go">Open &#9654;</span></span>` +
      `<span class="mod-txt"><span class="mod-name">${m.name}</span><span class="mod-blurb">${m.blurb}</span></span></span></button>`).join('');

    $('#tagline').textContent = CONFIG.tagline;
  }
  /* arrow keys jump to the nearest brick in that direction (works for the offset rows) */
  function navigate(key) {
    const els = $$('#bricks .mod'), cur = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.mod') : null;
    if (!cur) { els[0].focus(); return; }
    const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, horiz = key === 'ArrowLeft' || key === 'ArrowRight';
    let best = null, bd = Infinity;
    els.forEach(el => {
      if (el === cur) return;
      const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - cx, dy = b.top + b.height / 2 - cy;
      const ok = key === 'ArrowRight' ? dx > 8 : key === 'ArrowLeft' ? dx < -8 : key === 'ArrowDown' ? dy > 8 : dy < -8;
      if (!ok) return;
      const d = (horiz ? Math.abs(dx) + Math.abs(dy) * 2.2 : Math.abs(dy) + Math.abs(dx) * 2.2);
      if (d < bd) { bd = d; best = el; }
    });
    if (best) best.focus();
  }
  return { build, navigate };
})();

/* ───────── panels ───────── */
const Panels = (() => {
  const host = $('#panels');

  let wrap = null, opener = null, cleanup = null, lb = null, lbIdx = 0, lbFrom = null;

      list.innerHTML = f.length
